name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/poker-training-app-Iyrkb]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone --depth=1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git checkout ${{ github.ref_name }}

      - name: Setup Node & Build
        run: |
          cd repo
          node --version
          npm ci
          npm run generate-pwa-assets
          npm run build

      - name: Deploy to gh-pages branch
        run: |
          cd repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Move dist out, switch to gh-pages, replace content
          cp -r dist ../dist_build

          git fetch origin gh-pages 2>/dev/null || true
          git checkout --orphan gh-pages-new
          git rm -rf . --quiet

          cp -r ../dist_build/. .
          touch .nojekyll

          git add -A
          git commit -m "Deploy: ${{ github.sha }}"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages-new:gh-pages --force
